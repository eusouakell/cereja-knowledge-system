name: Flame Visual Gates

on:
  pull_request:
    paths:
      - "brand/flame/visual-delivery/**"
      - "brand/flame/qa.md"
      - "tests/test_flame_visual_gates.py"
      - ".github/workflows/flame-visual-gates.yml"
  push:
    branches:
      - flame-visual-gates
      - main
    paths:
      - "brand/flame/visual-delivery/**"
      - "brand/flame/qa.md"
      - "tests/test_flame_visual_gates.py"
      - ".github/workflows/flame-visual-gates.yml"

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Observe specimen
        run: |
          python brand/flame/visual-delivery/sensor_html.py \
            brand/flame/visual-delivery/specimen.html
      - name: Gate specimen
        run: |
          python brand/flame/visual-delivery/check_html.py \
            brand/flame/visual-delivery/specimen.html
      - name: Run tests
        run: python -m unittest discover -s tests -v
